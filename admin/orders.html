<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orders | SANDRAGON Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="../css/style.css?v=20261026c">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><img src="../assets/logo.jpeg" style="height:30px"> <span class="brand-word">SAN<span class="brand-d">D</span><span class="brand-tail">RAGON</span></span></div>
    <a href="dashboard.html"><i class="fas fa-box"></i> Products</a>
    <a href="categories.html"><i class="fas fa-layer-group"></i> Categories</a>
    <a href="orders.html" class="active"><i class="fas fa-receipt"></i> Orders</a>
    <a href="banners.html"><i class="fas fa-images"></i> Banners</a>
    <a href="coupons.html"><i class="fas fa-tags"></i> Coupons</a>
    <a href="settings.html"><i class="fas fa-truck-fast"></i> Delivery</a>
    <a href="../index.html" target="_blank"><i class="fas fa-store"></i> View Store</a>
    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>Orders</h2>
      <div class="admin-actions">
        <button class="btn small outline" id="exportOrdersBtn"><i class="fas fa-file-excel"></i> Export Excel</button>
        <button class="btn small danger" id="deleteSelectedBtn" disabled><i class="fas fa-trash"></i> Delete Selected</button>
      </div>
    </div>
    <div class="admin-tabs" role="tablist" id="orderTabs">
      <button type="button" role="tab" class="admin-tab active" data-tab="new">New <span class="tab-count" id="countNew">0</span></button>
      <button type="button" role="tab" class="admin-tab" data-tab="confirmed">Confirmed <span class="tab-count" id="countConfirmed">0</span></button>
      <button type="button" role="tab" class="admin-tab" data-tab="delivered">Delivered <span class="tab-count" id="countDelivered">0</span></button>
      <button type="button" role="tab" class="admin-tab" data-tab="cancelled">Cancelled <span class="tab-count" id="countCancelled">0</span> <span class="tab-alert" id="countToVerify" hidden>0 to verify</span></button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="selectAllOrders" aria-label="Select all orders in this tab" style="width:auto"></th>
          <th>Order</th><th>Customer</th><th>Amount</th><th>Status</th><th>Placed</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="ordersTableBody">
        <tr><td colspan="7" class="text-center">Loading...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<!-- Order Detail / Action Modal -->
<div class="modal-overlay" id="orderModal">
  <div class="modal" style="max-width:600px">
    <h3>Order <span id="modalOrderId"></span></h3>
    <div id="modalOrderBody"></div>

    <div id="orderSteps">
    <div class="mt-20">
      <label class="mb-10" style="display:block;font-size:.85rem;color:var(--muted)">Step 1 · Confirm order with customer</label>
      <div class="whatsapp-preview" id="confirmPreview"></div>
      <div style="display:flex;gap:10px">
        <button class="btn small" id="markConfirmedBtn">Mark as Confirmed</button>
        <button class="btn small outline" id="sendConfirmWhatsAppBtn"><i class="fab fa-whatsapp"></i> Open WhatsApp to Send</button>
      </div>
    </div>

    <div class="mt-20">
      <label class="mb-10" style="display:block;font-size:.85rem;color:var(--muted)">Step 2 · Share order with vendor(s) for preparation</label>
      <div id="vendorShareContainer"></div>
    </div>

    <div class="mt-20">
      <label class="mb-10" style="display:block;font-size:.85rem;color:var(--muted)">Step 3 · Dispatch details (once vendor packs & couriers)</label>
      <div class="form-group">
        <label>Courier Name</label>
        <input type="text" id="courierNameInput" placeholder="e.g. Delhivery, DTDC, Blue Dart">
      </div>
      <div class="form-group">
        <label>AWB / Tracking Number</label>
        <input type="text" id="awbInput" placeholder="Tracking number from courier">
      </div>
      <button class="btn small" id="saveDispatchBtn">Save & Mark Shipped</button>
      <div class="whatsapp-preview mt-10" id="dispatchPreview" style="display:none"></div>
      <button class="btn small outline mt-10" id="sendDispatchWhatsAppBtn" style="display:none"><i class="fab fa-whatsapp"></i> Send Tracking to Customer</button>
    </div>

    <div class="mt-20">
      <label class="mb-10" style="display:block;font-size:.85rem;color:var(--muted)">Step 4 · Final status</label>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn small outline" id="markDeliveredBtn">Mark as Delivered</button>
        <button class="btn small danger" id="adminCancelBtn"><i class="fas fa-xmark"></i> Cancel Order</button>
      </div>
    </div>
    </div><!-- /#orderSteps -->

    <button class="btn outline mt-20" id="closeModalBtn" style="width:100%">Close</button>
  </div>
</div>

<script type="module" src="js/admin-orders.js?v=20261026c"></script>
<script src="../js/premium.js?v=20261015" defer></script>
</body>
</html>
