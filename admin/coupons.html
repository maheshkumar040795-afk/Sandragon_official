<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons | SANDRAGON Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="../css/style.css?v=20261019b">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><img src="../assets/logo.jpeg" style="height:30px"> <span class="brand-word">SAN<span class="brand-d">D</span><span class="brand-tail">RAGON</span></span></div>
    <a href="dashboard.html"><i class="fas fa-box"></i> Products</a>
    <a href="categories.html"><i class="fas fa-layer-group"></i> Categories</a>
    <a href="orders.html"><i class="fas fa-receipt"></i> Orders</a>
    <a href="banners.html"><i class="fas fa-images"></i> Banners</a>
    <a href="coupons.html" class="active"><i class="fas fa-tags"></i> Coupons</a>
    <a href="settings.html"><i class="fas fa-truck-fast"></i> Delivery</a>
    <a href="points.html"><i class="fas fa-coins"></i> Points</a>
    <a href="../index.html" target="_blank"><i class="fas fa-store"></i> View Store</a>
    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h2>Coupons</h2>
      <div class="admin-actions">
        <button class="btn small outline" id="exportCouponsBtn"><i class="fas fa-file-excel"></i> Export Excel</button>
        <button class="btn" id="addCouponBtn"><i class="fas fa-plus"></i> New Coupon</button>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>Code</th><th>Discount</th><th>Min Order</th><th>Used</th><th>Expires</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody id="couponsTableBody">
        <tr><td colspan="7" class="text-center">Loading...</td></tr>
      </tbody>
    </table>
  </main>
</div>

<!-- Add/Edit Coupon Modal -->
<div class="modal-overlay" id="couponModal">
  <div class="modal">
    <h3 id="modalTitle">New Coupon</h3>
    <input type="hidden" id="editingCode">

    <div class="form-group">
      <label>Coupon Code *</label>
      <input type="text" id="fCode" style="text-transform:uppercase" placeholder="e.g. WELCOME10">
    </div>
    <div class="form-group">
      <label>Discount Type *</label>
      <select id="fType">
        <option value="percent">Percentage (%)</option>
        <option value="flat">Flat Amount (₹)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Discount Value *</label>
      <input type="number" id="fValue" min="0">
    </div>
    <div class="form-group">
      <label>Minimum Order Amount (₹)</label>
      <input type="number" id="fMinOrder" min="0" placeholder="0 = no minimum">
    </div>
    <div class="form-group">
      <label>Expiry Date (optional)</label>
      <input type="date" id="fExpiry">
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="fActive" style="width:auto" checked> Active
      </label>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn" id="saveCouponBtn" style="flex:1">Save Coupon</button>
      <button class="btn outline" id="cancelModalBtn">Cancel</button>
    </div>
  </div>
</div>

<script type="module" src="js/admin-coupons.js?v=20261019b"></script>
<script src="../js/premium.js?v=20261015" defer></script>
</body>
</html>
