<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart & Checkout | SANDRAGON</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/logo.jpeg">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<header class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><img src="assets/logo.jpeg" alt="SANDRAGON">SAN<span class="d">D</span>RAGON</a>
    <nav class="nav-links" id="navLinks">
      <a href="index.html">Shop</a>
      <a href="cart.html" class="active cart-icon"><i class="fas fa-shopping-bag"></i> Cart
        <span class="cart-count" id="cartCount">0</span>
      </a>
      <a href="admin/login.html" title="Admin" style="opacity:.35"><i class="fas fa-lock"></i></a>
    </nav>
    <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
  </div>
</header>

<div class="container cart-page">
  <a class="back-btn" onclick="history.length > 1 ? history.back() : window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</a>
  <h2 class="section-title" style="margin-top:0">Your Cart</h2>
  <div id="cartItems"></div>

  <div id="checkoutSection" style="display:none">
    <h2 class="section-title">Delivery Details</h2>
    <div style="max-width:480px;margin:0 auto 30px">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="custName" required>
      </div>
      <div class="form-group">
        <label>Phone (WhatsApp) *</label>
        <input type="tel" id="custPhone" required placeholder="10-digit mobile number">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="custEmail">
      </div>
      <div class="form-group">
        <label>Delivery Address *</label>
        <textarea id="custAddress" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label>Pincode *</label>
        <input type="text" id="custPincode" required>
      </div>
    </div>

    <div class="cart-summary">
      <div class="summary-row"><span>Subtotal</span><span id="subtotalVal">₹0</span></div>
      <div class="summary-row"><span>Shipping</span><span id="shippingVal">Free</span></div>
      <div class="summary-row total"><span>Total</span><span id="totalVal">₹0</span></div>
      <button class="btn mt-20" id="payBtn" style="width:100%">
        <i class="fas fa-lock"></i> Pay Securely with Razorpay
      </button>
      <p class="stock-note mt-10 text-center">100% secure payment — cards, UPI, netbanking &amp; wallets</p>
    </div>
  </div>
</div>

<footer>
  <p>&copy; <span id="year"></span> SANDRAGON. All rights reserved.</p>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
document.getElementById('hamburgerBtn').addEventListener('click', () => {
  document.getElementById('navLinks').classList.toggle('active');
});
</script>
<script type="module" src="js/cart.js"></script>
<script src="js/premium.js" defer></script>
</body>
</html>
